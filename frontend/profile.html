<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Google Translation -->
    <meta name="google" content="notranslate">

    <!-- Primary SEO -->
    <title>Portfolio & Projects | Machpadaco Global Services</title>

    <meta
        name="description"
        content="Explore Machpadaco Global Services' portfolio of software development projects, digital solutions, websites, web applications, and technology projects for businesses and organizations."
    >

    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link
        rel="canonical"
        href="https://machpadaco.com/portfolio.html"
    >

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">

    <meta
        property="og:title"
        content="Portfolio & Projects | Machpadaco Global Services"
    >

    <meta
        property="og:description"
        content="Explore Machpadaco Global Services' software development projects, digital solutions, websites, web applications, and technology projects."
    >

    <meta
        property="og:url"
        content="https://machpadaco.com/portfolio.html"
    >

    <meta
        property="og:site_name"
        content="Machpadaco Global Services"
    >

    <!-- Twitter / X -->
    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Portfolio & Projects | Machpadaco Global Services"
    >

    <meta
        name="twitter:description"
        content="Explore Machpadaco Global Services' software development projects, digital solutions, websites, web applications, and technology projects."
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/jpeg"
        href="assets/img/favicon.jpg"
    >

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main Stylesheet -->
    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>



<body data-page="profile">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- PROFILE DASHBOARD -->
    <main>

        <section class="profile-dashboard">

            <div class="profile-card">

                <!-- PROFILE IMAGE -->
                <div class="profile-image-box">

                    <img
                        src="assets/img/default-user.png"
                        id="profileImage"
                        class="profile-large-pic"
                        alt="Profile"
                    >

                    <input
                        type="file"
                        id="imageUpload"
                        hidden
                    >

                    <button
                        type="button"
                        id="changePhotoBtn"
                    >
                        Change Photo
                    </button>

                </div>

                <!-- USER INFO -->
                <h2 id="profileName">
                    Loading...
                </h2>

                <p id="profileEmail">
                    Loading...
                </p>

                <p id="profilePhone">
                    Loading...
                </p>

                <!-- EDIT SECTION -->
                <div class="edit-section">

                    <input
                        type="text"
                        id="editName"
                        placeholder="Update Name"
                    >

                    <input
                        type="text"
                        id="editPhone"
                        placeholder="Update Phone"
                    >

                    <button
                        type="button"
                        id="saveProfileBtn"
                    >
                        Save Changes
                    </button>

                </div>

                <!-- DASHBOARD STATS -->
                <div class="dashboard-stats">

                    <div class="stat-box">
                        <h3>₦0</h3>
                        <p>Earnings</p>
                    </div>

                    <div class="stat-box">
                        <h3>0</h3>
                        <p>Referrals</p>
                    </div>

                    <div class="stat-box">
                        <h3>0</h3>
                        <p>Courses</p>
                    </div>

                </div>

                <!-- LOGOUT -->
                <button
                    type="button"
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Main JavaScript Controller -->
    <script type="module" src="assets/js/main.js"></script>

</body>
</html>
